name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    name: Déploiement
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Déploie le commit testé sur le serveur
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          # La clé est restreinte côté serveur au script de déploiement : seul le SHA est transmis
          ssh "ubuntu@$HOST" "${{ github.sha }}"

      - name: Vérifie que le site répond
        run: |
          for i in $(seq 1 10); do
            curl -fsS -o /dev/null https://melodyo.melwinchenu.fr/ && exit 0
            sleep 3
          done
          exit 1
